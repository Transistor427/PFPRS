[force_move]
enable_force_move: True

[save_variables]
filename: /home/pi/printer_data/config/toolchanger-settings.cfg

# Python-модуль PFPRS (файл должен быть в klippy/extras/pfprs.py)
# Аварийный homing XY остаётся в homing.cfg принтера — не переносится в Python
[pfprs]
dual: True
debug_mode: False
save_interval: 15
history_size: 3
save_delay: 1
gcode_path: ~/printer_data/gcodes
restore_filename: restore.gcode
restart_macro: _START_PRINT_RESTORE
moonraker_url: http://127.0.0.1:7125

[gcode_macro SET_Z_ZERO_POSITION]
gcode:
    {% set bed_center_x = printer.configfile.config.stepper_x.position_max|float / 2 %}
    {% set bed_center_y = printer.configfile.config.stepper_y.position_max|float / 2 %}
    RESPOND PREFIX="[+]" MSG="Позиция оси Z установлена в 0"
	G90
	SET_KINEMATIC_POSITION X={bed_center_x} Y={bed_center_y} Z=0

[gcode_macro SET_Z_MAX_POSITION]
gcode:
    {% set z_max = printer.toolhead.axis_maximum.z|float %}
    {% set bed_center_x = printer.configfile.config.stepper_x.position_max|float / 2 %}
    {% set bed_center_y = printer.configfile.config.stepper_y.position_max|float / 2 %}
    RESPOND PREFIX="[+]" MSG="Позиция оси Z установлена в {z_max}"
	G90
	SET_KINEMATIC_POSITION X={bed_center_x} Y={bed_center_y} Z={z_max}

[gcode_macro _LOG_Z]
gcode:
    {% set z_pos = params.Z %}
    # Полное сохранение: XY (gcode до skew), offset файла, обе температуры, активная голова
    PFPRS_SAVE_STATE Z={z_pos}

[gcode_macro _START_PRINT_RESTORE]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set Z_POS = svv.pr_z|float %}
    {% set X_POS = svv.pr_x|default(0)|float %}
    {% set Y_POS = svv.pr_y|default(0)|float %}
    {% set T_BED = svv.pr_t_bed|float %}
    {% set T_EXTRUDER = svv.pr_t_ext|float %}
    {% set T_EXTRUDER1 = svv.pr_t_ext1|default(0)|float %}
    {% set T_CHAMBER = svv.pr_t_chamb|default(0)|float %}
    {% set ACTIVE_EXT_PRINT = svv.pr_act_ext|default('extruder')|string %}
    {% set Z_CALIBRATED = svv.pr_z_calibrated|default(False) %}
    {% set z_was_calibrated = Z_CALIBRATED %}
    SAVE_VARIABLE VARIABLE=emergency_homing VALUE=True
    {% if Z_CALIBRATED %}
        RESPOND PREFIX="[+]" MSG="Z уже откалиброван зондом, SET_KINEMATIC_POSITION Z пропущен"
        SAVE_VARIABLE VARIABLE=pr_z_calibrated VALUE=False
    {% else %}
        RESPOND PREFIX="[+]" MSG="Установлена высота по оси Z - {Z_POS}"
        SET_KINEMATIC_POSITION Z={Z_POS}
    {% endif %}
    G4 P2000
    RESPOND PREFIX="[+]" MSG="Запуск печати файла восстановления"
    G4 P2000
    RESPOND PREFIX="[+]" MSG="Включен нагрев стола до {T_BED}"
    M140 S{T_BED}
    RESPOND PREFIX="[+]" MSG="Проверяем температуру хотенда"
    {% if ACTIVE_EXT_PRINT == "extruder" %}
        {% if T_EXTRUDER > 150 %}
            {% if printer.extruder.temperature > 200 %}
                RESPOND PREFIX="[+]" MSG="Температура 1-й головы больше 200 градусов. Парковка осей XY разрешена"
                M104 T0 S{T_EXTRUDER}
                {% if T_EXTRUDER1 > 150 %}
                    M104 T1 S{T_EXTRUDER1}
                {% endif %}
                G91
                G1 Z5
                G90
                G28
                {% if not z_was_calibrated %}
                SET_KINEMATIC_POSITION Z={Z_POS + 5}
                {% endif %}
                T0
            {% else %}
                G4 P2000
                RESPOND PREFIX="[+]" MSG="Температура 1-й головы меньше 200 градусов. Включен нагрев хотенда"
                M104 T0 S200
                TEMPERATURE_WAIT SENSOR=extruder MINIMUM=200
                G91
                G1 Z5
                G90
                G28
                {% if not z_was_calibrated %}
                SET_KINEMATIC_POSITION Z={Z_POS + 5}
                {% endif %}
                T0
            {% endif %}
            G4 P2000
            RESPOND PREFIX="[+]" MSG="Включен нагрев 1-й головы до {T_EXTRUDER}"
            M104 T0 S{T_EXTRUDER}
            M109 T0 S{T_EXTRUDER}
            {% if T_EXTRUDER1 > 150 %}
                RESPOND PREFIX="[+]" MSG="Подогрев 2-й головы до {T_EXTRUDER1} (dual)"
                M104 T1 S{T_EXTRUDER1}
            {% endif %}
        {% else %}
            { action_raise_error("Ошибка! Активирована 1-я голова, но она не использовалась в печати") }
        {% endif %}
    {% else %}
        {% if T_EXTRUDER1 > 150 %}
            {% if printer.extruder1.temperature > 200 %}
                RESPOND PREFIX="[+]" MSG="Температура 2-й головы больше 200 градусов. Парковка осей XY разрешена"
                M104 T1 S{T_EXTRUDER1}
                {% if T_EXTRUDER > 150 %}
                    M104 T0 S{T_EXTRUDER}
                {% endif %}
                G91
                G1 Z5
                G90
                ACTIVATE_EXTRUDER EXTRUDER=extruder1
                G28
                {% if not z_was_calibrated %}
                SET_KINEMATIC_POSITION Z={Z_POS + 5}
                {% endif %}
                T1
            {% else %}
                G4 P2000
                RESPOND PREFIX="[+]" MSG="Температура 2-й головы меньше 200 градусов. Включен нагрев хотенда"
                M104 T1 S200
                TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM=200
                G91
                G1 Z5
                G90
                ACTIVATE_EXTRUDER EXTRUDER=extruder1
                G28
                {% if not z_was_calibrated %}
                SET_KINEMATIC_POSITION Z={Z_POS + 5}
                {% endif %}
                T1
            {% endif %}
            G4 P2000
            RESPOND PREFIX="[+]" MSG="Включен нагрев 2-й головы до {T_EXTRUDER1}"
            M104 T1 S{T_EXTRUDER1}
            M109 T1 S{T_EXTRUDER1}
            {% if T_EXTRUDER > 150 %}
                RESPOND PREFIX="[+]" MSG="Подогрев 1-й головы до {T_EXTRUDER} (dual)"
                M104 T0 S{T_EXTRUDER}
            {% endif %}
        {% else %}
            { action_raise_error("Ошибка! Активирована 2-я голова, но она не использовалась в печати") }
        {% endif %}
    {% endif %}
    {% if T_CHAMBER > 0 %}
        RESPOND PREFIX="[+]" MSG="Включен нагрев камеры до {T_CHAMBER}"
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET={T_CHAMBER}
    {% endif %}
    G4 P2000
    RESPOND PREFIX="[+]" MSG="Ожидание нагрева стола до {T_BED}"
    M190 S{T_BED}
    RESPOND PREFIX="[+]" MSG="Нагрев всех нагревателей завершен"
    G90
    G1 Z{Z_POS + 5} F600
    G21
    M83
    G1 E20 F2100
    RESPOND PREFIX="[+]" MSG="Перемещение в точку восстановления X={X_POS} Y={Y_POS} Z={Z_POS}"
    G1 X{X_POS} Y={Y_POS} F6000
    G1 Z{Z_POS} F300
    SAVE_VARIABLE VARIABLE=emergency_homing VALUE=False
    PFPRS_ENABLE
    RESPOND PREFIX="[+]" MSG="Начало печати"

[gcode_macro PROBE_Z_FOR_RESTORE]
description: Калибровка Z зондом по пластине (PLATE=толщина мм, по умолчанию 1) и запуск _START_PRINT_RESTORE
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if 'pr_z' not in svv %}
        { action_raise_error("PFPRS: нет сохранённой высоты pr_z") }
    {% endif %}
    {% set plate = params.PLATE|default(1.0)|float %}
    {% set part_z = svv.pr_z|float %}
    {% set target_z = part_z + plate %}
    {% set x_mid = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_mid = printer.toolhead.axis_maximum.y|float / 2 %}
    {% set z_start = printer.toolhead.axis_maximum.z|float - 5.0 %}
    RESPOND PREFIX="[+]" MSG="Калибровка Z: центр стола, Z={z_start}, пластина={plate} мм, высота детали={part_z}"
    RESPOND PREFIX="[+]" MSG="Подведите голову над пластиной на детали, затем дождитесь probe"
    SET_KINEMATIC_POSITION X={x_mid} Y={y_mid} Z={z_start}
    PROBE
    RESPOND PREFIX="[+]" MSG="Probe OK. Задаём Z={target_z} (деталь {part_z} + пластина {plate})"
    SET_KINEMATIC_POSITION Z={target_z}
    G90
    G1 Z{target_z + 5} F600
    SAVE_VARIABLE VARIABLE=pr_z_calibrated VALUE=True
    RESPOND PREFIX="[+]" MSG="Уберите пластину при необходимости. Запуск восстановления"
    _START_PRINT_RESTORE

[gcode_macro RESUME_WITH_PROBE]
description: Собрать restore.gcode, откалибровать Z зондом (PLATE=1) и продолжить печать
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set last_file = params.GCODE_FILE|default(svv.pr_file)|string %}
    {% set plate = params.PLATE|default(1.0)|float %}
    {% if last_file != 'None' and last_file != '' %}
        _PROMPT_END
        PFPRS_BUILD_RESTORE GCODE_FILE="{last_file}" SKIP_START=1
        PROBE_Z_FOR_RESTORE PLATE={plate}
        SDCARD_PRINT_FILE FILENAME=restore.gcode
    {% else %}
        RESPOND TYPE=error MSG="Файл для восстановления не найден!"
        _PROMPT_END
    {% endif %}

[gcode_macro _RESUME_INTERRUPTED_CURR]
description: Продолжить печать с сохранённой позиции (файл + XY), с учётом активной головы
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set last_file = params.GCODE_FILE|default(svv.pr_file)|string %}
    {% if last_file != 'None' and last_file != '' %}
        _PROMPT_END
        PFPRS_BUILD_RESTORE GCODE_FILE="{last_file}"
        SDCARD_PRINT_FILE FILENAME=restore.gcode
    {% else %}
        RESPOND TYPE=error MSG="Файл для восстановления не найден!"
        _PROMPT_END
    {% endif %}

[gcode_macro _PROMPT_END]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro SHOW_RESUME_INTERRUPTED]
description: Возобновление последней печати с сохранённой позиции (вызывается вручную)
gcode:
    _RESUME_INTERRUPTED_CURR
