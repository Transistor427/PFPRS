# PFPRS — восстановление печати после отключения питания
# Конфигурация для двухголового принтера (extruder / extruder1).
#
# Требуется в printer.cfg: [virtual_sdcard], [print_stats], [respond]
# и модуль klippy/extras/pfprs.py.
# Дополнительно подключите секцию [homing_override] из homing.cfg —
# без неё парковка при восстановлении опустит ось Z в деталь.
#
# ВНИМАНИЕ: PFPRS больше не использует [save_variables]. Если секция нужна
# вашему тулченджеру, оставьте её в printer.cfg и укажите корректный путь для
# своего пользователя (в v4 здесь был жёстко прописан /home/pi):
#   [save_variables]
#   filename: ~/printer_data/config/toolchanger-settings.cfg

# Нужен для SET_KINEMATIC_POSITION. Раскомментируйте, ТОЛЬКО если секции
# [force_move] ещё нет в вашем printer.cfg — дубль секции Klipper не запустит.
#[force_move]
#enable_force_move: True

[pfprs]
dual: True
debug_mode: False

sample_interval: 1.0
save_interval: 5.0
resume_lag: 2.0
resume_timeout: 1800

gcode_path: ~/printer_data/gcodes
state_path: ~/printer_data/pfprs/state

verify_source: True
restore_gcode_offset: True
arm_emergency_homing: True
bed_mesh_fallback_profile:
chamber_heater: chamber
part_fan: fan

z_hop: 5.0
z_lift_speed: 600
travel_speed: 6000
prime_length: 20.0
prime_speed: 2100
prime_retract: 1.0
safe_home_temp: 200
min_active_temp: 150

auto_resume: True
auto_resume_temp_delta: 20.0
auto_resume_delay: 5.0
auto_resume_min_target: 100
auto_resume_after_shutdown: False
auto_resume_max_age: 0

# Нажатие кнопки аварийного останова - осознанное действие оператора, а не
# сбой питания. При True такая остановка снимает точку восстановления совсем:
# ни автоматики, ни диалога с предложением продолжить.
# emergency_stop_markers - подстроки причины остановки, которые считаются
# нажатием кнопки. Klipper пишет "Shutdown due to M112 command".
emergency_stop_discards: True
emergency_stop_markers: M112, emergency stop

# Необязательный крючок: макрос, который выполняется последним, уже после
# восстановления контекста печати и прямо перед продолжением файла.
# Пример: на тулченджерах смену инструмента при восстановлении не делают,
# поэтому SKEW и подобные машинно-специфичные вещи из макросов T0/T1 сюда.
#post_restore_macro: SKEW

restart_macro: _START_PRINT_RESTORE
prompt_macro: _PFPRS_PROMPT_RECOVERY
auto_resume_macro: _PFPRS_AUTO_RESUME


# ==========================================================================
#  Подготовка принтера к продолжению печати
# ==========================================================================
[gcode_macro _START_PRINT_RESTORE]
description: Прогрев, парковка XY, выбор головы и возврат в точку останова
gcode:
    {% set p = printer.pfprs %}
    {% set z_max = printer.toolhead.axis_maximum.z|float %}
    {% set hop = [[p.z_hop|float, z_max - p.z_ref|float - 1.0]|min, 0.0]|max %}
    {% set second = p.active_extruder == 'extruder1' %}
    {% set t_active = p.t_ext1 if second else p.t_ext %}
    {% set t_idle = p.t_ext if second else p.t_ext1 %}
    {% set sensor = 'extruder1' if second else 'extruder' %}
    {% set tool = 1 if second else 0 %}
    {% set temp_now = printer.extruder1.temperature if second else printer.extruder.temperature %}

    {% if not p.armed %}
        { action_raise_error("PFPRS: возобновление не подготовлено, нужен PFPRS_PREPARE_RESUME") }
    {% endif %}
    {% if t_active <= p.min_active_temp %}
        { action_raise_error("PFPRS: активной сохранена голова %s, но её целевая температура слишком низкая" % p.active_extruder) }
    {% endif %}
    # До любого движения убеждаемся, что на слайдере физически та же голова
    _PFPRS_VERIFY_TOOL

    RESPOND PREFIX="[+]" MSG="PFPRS: восстановление {p.file}, слой {p.current_layer} из {p.total_layer}"
    RESPOND PREFIX="[+]" MSG="Активная голова T{tool} ({p.active_extruder}), точка останова X={p.x} Y={p.y} Z={p.z}"

    {% if p.z_calibrated %}
        RESPOND PREFIX="[+]" MSG="Высота Z уже выставлена вручную или зондом"
    {% else %}
        SET_KINEMATIC_POSITION Z={p.z_ref}
    {% endif %}

    M140 S{p.t_bed}
    {% if p.t_chamb > 0 %}
        SET_HEATER_TEMPERATURE HEATER={p.chamber_heater} TARGET={p.t_chamb}
    {% endif %}

    # Пока пластик в сопле не размягчён, двигать XY нельзя — оторвём деталь
    {% if temp_now < p.safe_home_temp %}
        RESPOND PREFIX="[+]" MSG="Прогрев головы T{tool} до {p.safe_home_temp} градусов перед парковкой XY"
        M104 T{tool} S{[t_active, p.safe_home_temp]|max}
        TEMPERATURE_WAIT SENSOR={sensor} MINIMUM={p.safe_home_temp}
    {% else %}
        RESPOND PREFIX="[+]" MSG="Голова T{tool} горячая, парковка XY разрешена"
    {% endif %}
    # Вторую голову подогреваем фоном, если она участвовала в печати
    {% if t_idle > p.min_active_temp %}
        M104 T{1 - tool} S{t_idle}
    {% endif %}

    G90
    {% if hop > 0 %}
        G91
        G1 Z{hop} F{p.z_lift_speed}
        G90
    {% endif %}

    # ФИЗИЧЕСКАЯ смена инструмента при восстановлении НЕ выполняется.
    # После обрыва питания на слайдере уже стоит та голова, которая печатала,
    # и двигать её незачем. Вызывать здесь T0/T1 нельзя: эти макросы
    # рассчитаны на согласованное состояние машины, а после аварии Klipper
    # не знает, что физически стоит на слайдере. Их запуск приводит к
    # столкновению голов. Ограничиваемся логической активацией, а офсеты
    # инструмента восстанавливаются ниже из сохранённого homing_origin.
    ACTIVATE_EXTRUDER EXTRUDER={p.active_extruder}
    G28 Y
    G28 X
    # homing_override может сбросить Z в ноль — возвращаем реальную высоту
    SET_KINEMATIC_POSITION Z={(p.z_ref + hop)|round(4)}

    # Сетку стола восстанавливаем по имени профиля. Если печать шла с
    # адаптивной сеткой (BED_MESH_CALIBRATE ADAPTIVE=1), сохранённого профиля
    # не существует и загрузить его нельзя. Тогда поправка сетки уже учтена
    # в опорной высоте z_ref выше. В SET_GCODE_OFFSET она НЕ попадает:
    # макросы T0/T1 на тулченджерах читают homing_origin.z как babystep
    # оператора и записывают его в постоянную калибровку машины.
    {% if p.bed_mesh != '' %}
        RESPOND PREFIX="[+]" MSG="Загрузка сетки стола: {p.bed_mesh}"
        BED_MESH_PROFILE LOAD={p.bed_mesh}
    {% elif p.mesh_comp|abs > 0.0005 %}
        RESPOND PREFIX="[!]" MSG="Профиль сетки не сохранён (адаптивная сетка). Поправка {p.mesh_comp} мм учтена в опорной высоте"
    {% endif %}
    {% if p.restore_gcode_offset %}
        SET_GCODE_OFFSET X={p.offset_x} Y={p.offset_y} Z={p.offset_z}
    {% endif %}

    RESPOND PREFIX="[+]" MSG="Нагрев до рабочих температур: голова T{tool} {t_active}, стол {p.t_bed}"
    M104 T{tool} S{t_active}
    M109 T{tool} S{t_active}
    M190 S{p.t_bed}

    # Прайм выполняется на высоте подъёма, затем ретракт — иначе выдавленный
    # пластик протянется ниткой через деталь при переезде
    {% if p.prime_length > 0 %}
        M83
        G1 E{p.prime_length} F{p.prime_speed}
        {% if p.prime_retract > 0 %}
            G1 E-{p.prime_retract} F{p.prime_speed}
        {% endif %}
        G92 E0
    {% endif %}

    G90
    G21
    RESPOND PREFIX="[+]" MSG="Переезд в точку восстановления"
    G1 X{p.x} Y{p.y} F{p.travel_speed}
    G1 Z{p.z} F{p.z_lift_speed}
    {% if p.prime_length > 0 and p.prime_retract > 0 %}
        M83
        G1 E{p.prime_retract} F{p.prime_speed}
        G92 E0
    {% endif %}


# ==========================================================================
#  Сценарии возобновления
# ==========================================================================
[gcode_macro _PFPRS_DO_RESUME]
description: Полный цикл возобновления: подготовка, прогрев, продолжение файла
gcode:
    _PFPRS_PROMPT_CLOSE
    PFPRS_PREPARE_RESUME{% if params.GCODE_FILE is defined %} GCODE_FILE="{params.GCODE_FILE}"{% endif %}{% if params.FORCE is defined %} FORCE={params.FORCE}{% endif %}
    _START_PRINT_RESTORE
    PFPRS_BEGIN_RESUME

[gcode_macro SHOW_RESUME_INTERRUPTED]
description: Возобновить прерванную печать с сохранённой точки
gcode:
    _PFPRS_DO_RESUME{% if rawparams %} {rawparams}{% endif %}

[gcode_macro _RESUME_INTERRUPTED_CURR]
description: Псевдоним SHOW_RESUME_INTERRUPTED
gcode:
    _PFPRS_DO_RESUME{% if rawparams %} {rawparams}{% endif %}

[gcode_macro _PFPRS_AUTO_RESUME]
description: Автоматическое возобновление (вызывается модулем PFPRS)
gcode:
    {% set p = printer.pfprs %}
    RESPOND PREFIX="[+]" MSG="PFPRS: питание восстановлено. Голова {p.active_extruder} {p.temp_actual} при сохранённой цели {p.temp_target}, остыла на {p.temp_drop} градусов"
    RESPOND PREFIX="[+]" MSG="Условие автовозобновления выполнено, продолжаю печать без участия оператора"
    _PFPRS_DO_RESUME


# ==========================================================================
#  Диалоги
# ==========================================================================
# Ставится ПЕРВОЙ строкой в ваш END_PRINT (и, при желании, в CANCEL_PRINT).
# С этого момента деталь допечатана: сохранять больше нечего, а точку надо
# снять — иначе обрыв питания во время охлаждения или парковки заставит
# принтер предложить «восстановить» уже готовую печать.
# --------------------------------------------------------------------------
# Проверка физического состояния голов перед восстановлением.
# ЗАВИСИТ ОТ МАШИНЫ: имена датчиков и трактовку состояния подправьте под свой
# тулченджер. Здесь PRESSED означает, что голова вне своей парковки, то есть
# стоит на слайдере.
# Смысл: после обрыва питания Klipper не знает, что физически на слайдере.
# Если там не та голова, что печатала, восстановление недопустимо — любое
# движение приведёт к столкновению.
# --------------------------------------------------------------------------
[gcode_macro _PFPRS_VERIFY_TOOL]
description: Сверить голову на слайдере с сохранённой в точке восстановления
gcode:
    {% set want = printer.pfprs.active_extruder %}
    {% set have = ('gcode_button t0_parking' in printer) and ('gcode_button t1_parking' in printer) %}
    {% if not have %}
        RESPOND PREFIX="[!]" MSG="PFPRS: датчики парковки не найдены, проверка головы пропущена"
    {% else %}
        {% set p0 = printer['gcode_button t0_parking'].state %}
        {% set p1 = printer['gcode_button t1_parking'].state %}
        {% if p0 == 'PRESSED' and p1 == 'RELEASED' %}
            {% set on_slider = 'extruder' %}
        {% elif p1 == 'PRESSED' and p0 == 'RELEASED' %}
            {% set on_slider = 'extruder1' %}
        {% else %}
            {% set on_slider = 'unknown' %}
        {% endif %}
        {% if on_slider == 'unknown' %}
            { action_raise_error("PFPRS: неопределённое состояние парковок (T0=%s, T1=%s). Приведите головы в исходное положение вручную, затем повторите восстановление" % (p0, p1)) }
        {% elif on_slider != want %}
            { action_raise_error("PFPRS: на слайдере %s, а печать велась с %s. Смена инструмента при восстановлении не выполняется. Установите нужную голову вручную через панель управления, затем повторите" % (on_slider, want)) }
        {% else %}
            RESPOND PREFIX="[+]" MSG="На слайдере {on_slider} — совпадает с сохранённой головой"
        {% endif %}
    {% endif %}

[gcode_macro PFPRS_PRINT_DONE]
description: Снять точку восстановления. Первой строкой в END_PRINT
gcode:
    PFPRS_DISABLE
    PFPRS_DISCARD

[gcode_macro _PFPRS_PROMPT_CLOSE]
description: Закрыть диалог PFPRS
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"

# _PROMPT_END здесь намеренно не объявляется: этот макрос уже определяет
# плагин timelapse, а дубль секции [gcode_macro] Klipper не запустит.
# Для закрытия диалога используйте _PFPRS_PROMPT_CLOSE.

[gcode_macro _PFPRS_PROMPT_RECOVERY]
description: Сообщение о неудачно завершённой печати с предложением восстановить
gcode:
    {% set p = printer.pfprs %}
    RESPOND TYPE=error MSG="Печать завершилась неудачно: {p.recovery_reason}"
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin PFPRS: печать прервана"
    RESPOND TYPE=command MSG="action:prompt_text Печать {p.file} была прервана и не может быть возобновлена автоматически."
    RESPOND TYPE=command MSG="action:prompt_text Причина: {p.recovery_reason}."
    {% if p.recovery_available %}
        RESPOND TYPE=command MSG="action:prompt_text Осмотрите деталь: не отслоилась ли она от стола и нет ли наплыва пластика в точке остановки. Наплыв нужно срезать, иначе сопло об него ударится."
        RESPOND TYPE=command MSG="action:prompt_text Затем откройте панель Действия - Движения - Аварийное перемещение и выполните действия по инструкции. Парковка оси Z сейчас заблокирована, сопло находится внутри детали."
        RESPOND TYPE=command MSG="action:prompt_text Когда деталь проверена, нажмите Возобновить печать."
        RESPOND TYPE=command MSG="action:prompt_footer_button Возобновить печать|SHOW_RESUME_INTERRUPTED|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Восстановить с калибровкой Z|RESUME_WITH_PROBE|secondary"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_text Возобновление невозможно. Проверьте, что файл печати не был изменён или перезалит после прерывания."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Отменить восстановление|PFPRS_DISCARD|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro PFPRS_RECOVERY_INFO]
description: Показать инструкцию по ручному восстановлению печати
gcode:
    {% set p = printer.pfprs %}
    RESPOND PREFIX="[i]" MSG="Файл: {p.file}, позиция {p.file_position} из {p.file_size}"
    RESPOND PREFIX="[i]" MSG="Точка останова X={p.x} Y={p.y} Z={p.z}, голова {p.active_extruder}, стол {p.t_bed}"
    RESPOND PREFIX="[i]" MSG="1. Осмотрите деталь: отслоение от стола и наплыв пластика в точке останова"
    RESPOND PREFIX="[i]" MSG="2. Наплыв срежьте, иначе сопло об него ударится при возврате"
    RESPOND PREFIX="[i]" MSG="3. Панель Действия - Движения - Аварийное перемещение, выполните действия по инструкции"
    RESPOND PREFIX="[i]" MSG="4. Запустите SHOW_RESUME_INTERRUPTED или нажмите кнопку восстановления"
    RESPOND PREFIX="[i]" MSG="Если стол просел, используйте RESUME_WITH_PROBE PLATE=1"


# ==========================================================================
#  Управление автовосстановлением с панели
# ==========================================================================
# Состояние сохраняется между перезагрузками. Для кнопки на панели удобнее
# всего PFPRS_AUTO_TOGGLE, для макросов в сценариях - явные ON/OFF.
[gcode_macro PFPRS_AUTO_ON]
description: Включить автоматическое возобновление после отключения питания
gcode:
    PFPRS_SET_AUTO_RESUME ENABLE=1
    RESPOND PREFIX="[+]" MSG="Автовосстановление ВКЛЮЧЕНО. Печать продолжится сама, если хотенд остыл не более чем на {printer.pfprs.auto_resume_temp_delta} градусов"

[gcode_macro PFPRS_AUTO_OFF]
description: Выключить автоматическое возобновление после отключения питания
gcode:
    PFPRS_SET_AUTO_RESUME ENABLE=0
    RESPOND PREFIX="[+]" MSG="Автовосстановление ВЫКЛЮЧЕНО. После обрыва питания будет только предложение восстановить вручную"

[gcode_macro PFPRS_AUTO_TOGGLE]
description: Переключить автоматическое возобновление
gcode:
    {% if printer.pfprs.auto_resume %}
        PFPRS_AUTO_OFF
    {% else %}
        PFPRS_AUTO_ON
    {% endif %}

# ==========================================================================
#  Ручная правка высоты Z
# ==========================================================================
[gcode_macro SET_Z_ZERO_POSITION]
description: Объявить текущую высоту оси Z нулевой
gcode:
    {% set x_mid = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_mid = printer.toolhead.axis_maximum.y|float / 2 %}
    RESPOND PREFIX="[+]" MSG="Позиция оси Z установлена в 0"
    G90
    SET_KINEMATIC_POSITION X={x_mid} Y={y_mid} Z=0

[gcode_macro SET_Z_MAX_POSITION]
description: Объявить текущую высоту оси Z максимальной
gcode:
    {% set z_max = printer.toolhead.axis_maximum.z|float %}
    {% set x_mid = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_mid = printer.toolhead.axis_maximum.y|float / 2 %}
    RESPOND PREFIX="[+]" MSG="Позиция оси Z установлена в {z_max}"
    G90
    SET_KINEMATIC_POSITION X={x_mid} Y={y_mid} Z={z_max}

[gcode_macro PROBE_Z_FOR_RESTORE]
description: Выставить Z зондом по пластине на детали. PLATE — толщина пластины, мм
gcode:
    {% set p = printer.pfprs %}
    {% if not p.valid %}
        { action_raise_error("PFPRS: нет сохранённой точки восстановления") }
    {% endif %}
    {% set plate = params.PLATE|default(1.0)|float %}
    {% set part_z = p.z_ref|float %}
    {% set target_z = part_z + plate %}
    {% set x_mid = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_mid = printer.toolhead.axis_maximum.y|float / 2 %}
    {% set z_start = printer.toolhead.axis_maximum.z|float - 5.0 %}
    RESPOND PREFIX="[+]" MSG="Калибровка Z: пластина {plate} мм, высота детали {part_z} мм"
    RESPOND PREFIX="[+]" MSG="Положите пластину на деталь и подведите голову над ней"
    SET_KINEMATIC_POSITION X={x_mid} Y={y_mid} Z={z_start}
    PROBE
    RESPOND PREFIX="[+]" MSG="Зонд сработал. Высота принята за {target_z} мм"
    SET_KINEMATIC_POSITION Z={target_z}
    PFPRS_SET_Z_CALIBRATED VALUE=1 Z={target_z}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin PFPRS: калибровка Z выполнена"
    RESPOND TYPE=command MSG="action:prompt_text Нажмите Продолжить. Сопло поднимется, после этого уберите пластину с детали."
    RESPOND TYPE=command MSG="action:prompt_footer_button Продолжить|_PFPRS_RESUME_AFTER_PROBE|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Отмена|PFPRS_ABORT_RESUME|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _PFPRS_RESUME_AFTER_PROBE]
description: Продолжить восстановление после калибровки Z зондом
gcode:
    _PFPRS_PROMPT_CLOSE
    _START_PRINT_RESTORE
    PFPRS_BEGIN_RESUME

[gcode_macro RESUME_WITH_PROBE]
description: Восстановление с калибровкой Z зондом по пластине. PLATE — толщина, мм
gcode:
    {% set plate = params.PLATE|default(1.0)|float %}
    _PFPRS_PROMPT_CLOSE
    PFPRS_PREPARE_RESUME{% if params.GCODE_FILE is defined %} GCODE_FILE="{params.GCODE_FILE}"{% endif %}
    PROBE_Z_FOR_RESTORE PLATE={plate}


# ==========================================================================
#  Совместимость со слайсером
