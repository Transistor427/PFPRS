[homing_override]
gcode:
      {% set svv = printer.save_variables.variables %}
      {% if svv.emergency_homing == True %}
            HOMING_EMERGENCY
      {% else %}
            HOMING
      {% endif %}
set_position_z: 0

[delayed_gcode DELAYED_HOMING_EMERGENCY]
gcode:
      SAVE_VARIABLE VARIABLE=emergency_homing VALUE=False
initial_duration: 0.5

[gcode_macro HOMING_EMERGENCY]
gcode:
      RESPOND PREFIX="[+]" MSG="Аварийные перемещения - Паркуем ось Y"
      G28 Y
      G4 P2000
      RESPOND PREFIX="[+]" MSG="Аварийные перемещения - Паркуем ось X"
      G28 X
