# PFPRS — парковка осей при восстановлении печати
#
# Перенесите секцию [homing_override] в homing.cfg вашего принтера.
# Пока PFPRS держит флаг аварийной парковки, ось Z НЕ паркуется: после
# отключения питания сопло стоит внутри детали, и обычный G28 Z повёл бы
# голову вниз сквозь напечатанное.
#
# Флаг взводится автоматически:
#   * при загрузке Klipper, если есть действительная точка восстановления
#     (опция arm_emergency_homing в секции [pfprs]);
#   * на время подготовки возобновления (PFPRS_PREPARE_RESUME).
# Снимается он при старте продолжения печати, при PFPRS_DISCARD,
# PFPRS_ABORT_RESUME и по таймауту resume_timeout.
# Вручную: PFPRS_SET_EMERGENCY_HOMING VALUE=0
#
# HOMING — ваш собственный макрос обычной парковки.

[homing_override]
axes: xyz
set_position_z: 0
gcode:
    {% set home_all = not ('X' in params or 'Y' in params or 'Z' in params) %}
    {% if printer.pfprs.emergency_homing %}
        RESPOND PREFIX="[!]" MSG="PFPRS: аварийная парковка, ось Z не паркуется"
        {% if home_all or 'Y' in params %}
            G28 Y
        {% endif %}
        {% if home_all or 'X' in params %}
            G28 X
        {% endif %}
        {% if 'Z' in params and not home_all %}
            RESPOND TYPE=error MSG="PFPRS: парковка Z заблокирована. Снимите блокировку командой PFPRS_SET_EMERGENCY_HOMING VALUE=0"
        {% endif %}
    {% else %}
        # Параметры сюда намеренно не передаются: голое имя оси ("G28 X")
        # не является парой key=value, и Klipper ответит Malformed command.
        # Если ваш HOMING умеет принимать оси — передайте их сами.
        HOMING
    {% endif %}

# Прежнее имя макроса, оставлено для существующих кнопок панелей
[gcode_macro HOMING_EMERGENCY]
description: Парковка XY без оси Z
gcode:
    PFPRS_SET_EMERGENCY_HOMING VALUE=1
    G28 Y
    G28 X
